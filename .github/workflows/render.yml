name: Render research guides
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'
          tinytex: true
      - name: Render HTML and PDF
        run: quarto render --to all
      - name: Verify expected outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s _output/index.html
          for guide in considering-llms proposal-support-toolkit science-harnesses; do
            test -s "_output/$guide.html"
            test -s "_output/$guide.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: research-guides-html
          path: _output/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: research-guides-pdf
          path: _output/*.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Upload GitHub Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _output/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
